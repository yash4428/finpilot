server {
  listen 80;
  root /usr/share/nginx/html;

  # The browser only talks to the Java API.
  location /api/ {
    proxy_pass http://backend-java:8080/;
    proxy_set_header Host $host;
    proxy_read_timeout 130s;
    client_max_body_size 6m;
  }

  location / {
    try_files $uri /index.html;
  }
}
