server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/finpilot}
    username: ${DB_USER:finpilot}
    password: ${DB_PASSWORD:finpilot}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  servlet:
    multipart:
      max-file-size: 5MB

finpilot:
  jwt-secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me-1234}
  jwt-ttl-hours: ${JWT_TTL_HOURS:72}
  ml-service-url: ${ML_SERVICE_URL:http://localhost:8000}
  internal-api-key: ${INTERNAL_API_KEY:dev-internal-key}
  # Days before a due date at which it becomes "due_soon" and a reminder fires.
  due-soon-days: 5
  # Daily reminder job (Spring cron: sec min hour day month weekday).
  reminder-cron: ${REMINDER_CRON:0 0 8 * * *}

logging:
  level:
    com.finpilot: INFO
